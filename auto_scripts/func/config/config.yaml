# Python UI & API Automation Framework Configuration

# Browser Configuration
browser: chrome  # Options: chrome, firefox, edge
headless: false  # Run browser in headless mode

# Timeouts (in seconds)
implicit_wait: 10
page_load_timeout: 30
explicit_wait: 10

# Application URLs
app:
  base_url: https://example.com
  login_url: https://example.com/login

# API Configuration
api:
  base_url: https://api.example.com
  timeout: 30
  verify_ssl: true

# Test Data
test_data:
  users:
    valid_user:
      username: standard_user
      password: secret_sauce
    invalid_user:
      username: invalid_user
      password: wrong_password

# Reporting
reporting:
  screenshots_on_failure: true
  video_recording: false
  report_format: html  # Options: html, json, xml

# Email Configuration (for test reports)
email:
  enabled: false
  smtp_server: smtp.gmail.com
  smtp_port: 587
  sender: test-automation@example.com
  recipients:
    - qa-team@example.com
  subject: Test Automation Report

# Logging
logging:
  level: INFO  # Options: DEBUG, INFO, WARNING, ERROR, CRITICAL
  log_file: logs/test_execution.log
