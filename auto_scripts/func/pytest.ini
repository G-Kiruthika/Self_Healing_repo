[pytest]
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    -p no:warnings
    --html=auto_scripts/func/reports/report.html
    --self-contained-html
testpaths = auto_scripts/func/tests
markers =
    smoke: Smoke tests
    regression: Regression tests
    ui: UI tests
    api: API tests
    slow: Slow running tests
log_cli = true
log_cli_level = INFO
log_file = auto_scripts/func/logs/pytest.log
log_file_level = DEBUG
timeout = 300
