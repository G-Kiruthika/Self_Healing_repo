[pytest]
# Pytest configuration file

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Markers
markers =
    ui: UI test cases
    api: API test cases
    smoke: Smoke test cases
    regression: Regression test cases
    integration: Integration test cases
    slow: Slow running tests

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

log_file = auto_scripts/func/logs/pytest.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] %(filename)s:%(lineno)d - %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# Output
addopts = 
    -v
    --strict-markers
    --tb=short
    --html=auto_scripts/func/reports/report.html
    --self-contained-html

# Parallel execution (uncomment to enable)
# addopts = -n auto

# Coverage (uncomment to enable)
# addopts = --cov=auto_scripts --cov-report=html:auto_scripts/func/reports/coverage
