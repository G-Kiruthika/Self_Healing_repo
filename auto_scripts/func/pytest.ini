[pytest]
# Pytest configuration for functional automation tests

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    -p no:cacheprovider

# Markers for test categorization
markers =
    smoke: Smoke tests that run quickly
    regression: Full regression test suite
    ui: UI automation tests
    functional: Functional test cases
    shortcuts: Tests related to shortcuts functionality
    email: Tests related to email functionality

# Test paths
testpaths = tests

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Coverage options (if using pytest-cov)
# addopts = --cov=auto_scripts --cov-report=html --cov-report=term
